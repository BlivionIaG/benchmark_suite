[project]
name = "benchmark-suite"
version = "0.1.0"
description = "Declarative benchmarking and quality scoring for OpenAI-compatible LLM endpoints"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "typer==0.27.2",
  "httpx==0.28.1",
  "numpy==2.5.2",
]

[project.optional-dependencies]
perplexity = ["lm-eval==0.4.12"]
judge      = ["promptfoo==0.1.4"]
agentic    = ["inspect-ai==0.3.260", "terminal-bench==0.2.18"]
kld-torch  = ["torch>=2.6"]
dev        = ["pytest>=8.3", "pytest-cov>=5", "respx==0.23.1", "ruff==0.16.5", "basedpyright==1.39.10", "pre-commit>=4"]

[project.scripts]
bs = "benchmark_suite.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "TID"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
