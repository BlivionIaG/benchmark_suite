name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies
        run: uv sync --extra dev --frozen
      - name: Run pytest
        run: uv run pytest tests/ -q
      - name: Run ruff
        run: uv run ruff check .
      - name: Run basedpyright (strict)
        run: uv run basedpyright benchmark_suite/ tests/
      - name: Smoke test bs doctor --dry-run
        run: |
          cat > /tmp/mock-recipe.yaml <<'YAML'
          meta:
            name: ci-smoke
            description: CI smoke test recipe
          backend:
            type: external
          endpoint:
            url: http://127.0.0.1:9   # intentionally unreachable; --dry-run always exits 0
          bench:
            scoring: []
          YAML
          uv run bs doctor /tmp/mock-recipe.yaml --dry-run
