meta:
  name: openai-compat
  description: >
    Mixed OpenAI-compatible workload: 31 diverse chat prompts on a 16/8/4/2/1
    concurrency ladder at 1k/512 and 16k/1k, plus 16 Pi-style coding-agent
    sessions whose context grows toward 200k tokens.
  version: "1.0.0"
  tags: [cross-platform, chat-load, session, openai-compat]
backend:
  type: external
endpoint:
  url: http://127.0.0.1:8000
  timeout_s: 3600
resources:
  tensor_parallel_size: 1
  max_model_len: 200000
  max_num_seqs: 16
bench:
  load: {}
  scoring:
    - kind: chat_load
      ladder: [16, 8, 4, 2, 1]
      suites:
        - name: short
          input_tokens: 1024
          output_tokens: 512
        - name: long
          input_tokens: 16384
          output_tokens: 1024
      temperature: 0.7
      stream: true
    - kind: session
      max_context_tokens: 200000
      n_sessions: 16
      output_tokens: 1024
      output_reserve_tokens: 2048
      temperature: 0.7
      stream: true
cell:
  family: dense
  attn: external
  linear: external
  cg: 0
  mtp: 0
hardware:
  vendor: other
  model: external endpoint (no local GPU)
  count: 0
  vram_gb: 0
